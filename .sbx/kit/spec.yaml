# GENERATED by rr7-starter/scripts/devcontainer-sync.mjs — do not edit here. Change devcontainer-template/sbx/ (shared) or .sbx/project.json (this project), then re-run.
# Docker Sandboxes kit (mixin) for panel.
#
# A kit is the CONFIGURATION layered onto a sandbox: dev env, startup steps,
# network policy and agent guidance. The IMAGE (Node, sqitch, psql, Claude Code, Codex,
# Playwright + Chromium, bun) is the shared rr7-sbx image built by rr7-starter/scripts/sbx-image.sh.
# No `requires.agent`, so the same kit works with `claude`, `codex` or `shell`:
#   sbx run -t rr7-sbx:latest claude --kit ./.sbx/kit
#
# Secrets are deliberately NOT in here. Real provider keys are registered on the
# host with `.sbx/secret.sh` (see ../README.md); the sandbox only ever sees
# a placeholder that the host proxy swaps in on the way out to the named host.
schemaVersion: "2"
kind: mixin
name: panel-dev

environment:
  variables:
    # vite.config.ts binds Vite to all interfaces only when DEVCONTAINER=true;
    # otherwise it listens on IPv6 loopback ([::1]) alone and a port published
    # with `-p 127.0.0.1:5195:5195` (IPv4, forwarded to the sandbox's
    # address) lands on nothing.
    DEVCONTAINER: "true"

setup:
  files:
    # Dev-only environment defaults. `setup.files` paths must be absolute and only
    # `content` gets ${WORKDIR} substituted, so the defaults land in the agent's
    # home and the startup script below copies them into the workspace as `.env`
    # — only if the workspace has none, so edits inside the sandbox persist.
    # Postgres, where the app has one, runs INSIDE the sandbox (it has its own
    # Docker daemon); the app's local-DB helper rewrites PG_PORT + both DB URLs
    # here to the port it picks. Every value is safe to read and to commit;
    # nothing is a real credential.
    - path: /home/agent/.rr7-dev-env
      mode: "0600"
      content: |
        # Written by .sbx/kit/spec.yaml at sandbox start. DEV-ONLY VALUES.
        # Real provider keys never belong here — register them on the host with
        # `./.sbx/secret.sh --host <api host> --env <VAR> ...` instead.
        # Role split (SECURITY.md §8): the app uses the runtime role, Sqitch the
        # migrate role. docker/initdb/01-roles.sql creates both on first start.
        DATABASE_URL=postgresql://panel_runtime:runtime@127.0.0.1:5441/panel
        DB_MIGRATE_URL=postgresql://panel_migrate:migrate@127.0.0.1:5441/panel
        PG_PORT=5441
        BETTER_AUTH_SECRET=dev-only-insecure-secret-for-sandbox
        BETTER_AUTH_URL=http://localhost:5195
        DEV_PORT=5195
        # Keeps email/SMS in-process so no real provider is called.
        NOTIFY_TRANSPORT=console
        LOG_LEVEL=debug
        NODE_ENV=development

    # Idempotent start hook: runs as the agent user BEFORE the agent attaches, on
    # every start (so each step guards itself). Foreground on purpose — the agent
    # should find deps installed and the database migrated, not race them.
    - path: /home/agent/.rr7-sbx-start.sh
      mode: "0755"
      content: |
        #!/usr/bin/env bash
        set -eu
        # The dispatcher runs this through `su`, which resets PATH; make the
        # image's Node + global npm bin visible regardless.
        export PATH="/usr/local/bin:/usr/local/share/npm-global/bin:$PATH"
        export HOME=/home/agent
        ws="${WORKDIR}"
        cd "$ws"
        log() { echo "rr7 kit: $*"; }

        if [ ! -e .env ]; then
          install -m 0600 /home/agent/.rr7-dev-env .env
          log "wrote dev-only .env"
        fi

        # Not every repo on the shared image is an npm app (a compose-only
        # deployment, a Python pipeline): then there is nothing to install or
        # migrate, and the sandbox is still useful as an isolated agent + Docker.
        if [ ! -f package.json ]; then
          log "no package.json — skipping npm ci and database setup"
          log "ready"
          exit 0
        fi
        # True when package.json declares the named npm script.
        has_script() { node -e 'process.exit(require("./package.json").scripts?.[process.argv[1]] ? 0 : 1)' "$1"; }

        if [ ! -d node_modules ]; then
          log "npm ci"
          npm ci --no-audit --no-fund
        fi

        # An app without the local-DB helper has no database to start here, so
        # say so and leave the agent to decide.
        if ! has_script db:local:up; then
          log "no db:local:up script — skipping database setup"
          log "ready"
          exit 0
        fi

        # Postgres lives in the sandbox's own Docker daemon, which the sandbox
        # starts alongside this hook — wait for its socket before compose.
        for _ in $(seq 1 90); do
          [ -S /var/run/docker.sock ] && docker info >/dev/null 2>&1 && break
          sleep 1
        done
        docker info >/dev/null 2>&1 || { log "docker daemon not up after 90s; skipping database"; exit 0; }

        log "npm run db:local:up"
        npm run db:local:up
        # db:local:up wrote the port it picked; wait for Postgres to accept
        # connections (a deploy straight after `up` races the server's init).
        pgport="$(grep -E '^PG_PORT=' .env | tail -1 | cut -d= -f2)"
        for _ in $(seq 1 60); do
          pg_isready -q -h 127.0.0.1 -p "${pgport:-5441}" -U app && break
          sleep 1
        done
        log "npm run db:deploy"
        for attempt in 1 2 3; do
          npm run db:deploy && break
          [ "$attempt" = 3 ] && { log "db:deploy failed 3 times"; exit 1; }
          sleep 3
        done
        log "ready"
  startup:
    - description: Install deps, start Postgres and migrate (idempotent)
      command: ["bash", "/home/agent/.rr7-sbx-start.sh"]

permissions:
  network:
    # project.json `firewall.domains`, plus the base hosts and what each tool
    # flag adds. sbx's default "balanced" policy already covers Anthropic, npm
    # and GitHub; listing them again is harmless.
    allow:
      # npm
      - "registry.npmjs.org"
      # Claude Code
      - "api.anthropic.com"
      # Sentry
      - "sentry.io"
      # Statsig (Claude Code feature flags)
      - "statsig.com"
      # VS Code extensions
      - "marketplace.visualstudio.com"
      # VS Code server download
      - "vscode.blob.core.windows.net"
      # VS Code server download
      - "update.code.visualstudio.com"
      # GitLab remotes
      - "gitlab.com"
      # Google Fonts (loaded by the app in dev)
      - "fonts.googleapis.com"
      # Codex CLI — /v1/responses (the API-key path)
      - "api.openai.com"
      # Codex CLI — /oauth/token, /api/accounts (sign-in + token refresh)
      - "auth.openai.com"
      # Codex CLI — /backend-api/codex (ChatGPT-plan auth) + /otlp/v1/metrics telemetry
      - "chatgpt.com"
      # Maileroo — server-side transactional email (app/lib/notify/email.server.ts)
      - "smtp.maileroo.com"
      # Twilio — SMS / phone OTP (app/lib/notify/sms.server.ts)
      - "api.twilio.com"
      # Playwright browser downloads (`npx playwright install`)
      - "cdn.playwright.dev"
      # Chrome for Testing builds, where cdn.playwright.dev redirects (Playwright 1.63+)
      - "storage.googleapis.com"

agentInstructions:
  content: |
    # Working in the panel sandbox

    - This is a Docker Sandbox microVM with its own Docker daemon. The start hook
      already ran `npm ci`, started Postgres (`npm run db:local:up`) and
      applied migrations (`npm run db:deploy`); rerun any of them yourself if needed.
    - `.env` holds DEV-ONLY values written by the sandbox kit. Never paste real
      credentials into it. Provider keys, when present, appear as placeholder
      values that the host proxy substitutes on outbound requests; treat them as
      opaque and do not try to print or decode them.
    - Email and SMS use the `console` transport here; no real messages are sent.
    - Playwright and a headless Chromium are preinstalled (`playwright` CLI, browsers in
      /ms-playwright). Use them to check UI changes in the running dev server and save
      screenshots into the workspace. If the app's own @playwright/test is another
      version, `npx playwright install chromium` fetches the matching browser.
    - Verification gate before declaring work done:
      `npm run typecheck && npm run lint && npm run format:check && npm test && npm run build`.
    - Push over HTTPS on a feature branch; never commit `.env`.
